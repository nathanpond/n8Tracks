name: build
on: pull_request
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        run: |
          npm run lint
          echo done
      - shell: "powershell"
        run: |
          dotnet build -warnaserror
          echo done
      - shell: cmd
        run: npm test
      - shell: python
        run: print("checked")
