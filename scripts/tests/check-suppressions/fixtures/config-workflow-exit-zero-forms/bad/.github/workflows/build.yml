name: build
on: pull_request
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: npm run lint || exit 00
      - run: npm run lint || exit $((0))
      - run: npm run typecheck || exit 256
      - run: dotnet build -warnaserror; exit 00
      - run: scripts/build.sh || exit "$((1 - 1))"
      - run: scripts/build.sh || return 0x0
      - run: |
          trap 'exit 00' EXIT
          npm test
