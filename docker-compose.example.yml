# n8Tracks with Docker Compose. Copy this file to docker-compose.yml, adjust it, and start it:
#
#   docker compose up -d --build
#
# or run it as it is, from the repository root:
#
#   docker compose -f docker-compose.example.yml up -d --build
#
# Then open http://localhost:8787/. See "Run with Docker" in the README.

services:
  n8tracks:
    # Built from this repository. Published images come with the first release.
    build: .
    image: n8tracks:dev
    container_name: n8tracks
    restart: unless-stopped
    # On "docker compose stop" or "down", a running background job (a backup, an import) is asked to
    # stop and given 30 seconds; Docker's default of 10 seconds would cut that short.
    stop_grace_period: 45s
    ports:
      - "8787:8787"
    environment:
      # The user and group n8Tracks runs as, and that own what it writes under /data and /backup.
      # Use the output of `id -u` and `id -g` for the account that owns the folders below.
      PUID: "1000"
      PGID: "1000"
      # Time zone that times are shown in: an IANA time zone ID such as Europe/Oslo.
      TZ: Etc/UTC
      # The settings below are shown with their defaults; a line you do not change can be removed.
      # Port the app listens on inside the container. If you change it, change the right-hand side
      # of the port mapping above to match.
      N8TRACKS_PORT: "8787"
      # Public URL of the app. Behind a reverse proxy on a sub-path, include the path, for example
      # https://nas.example/n8tracks; the app is then served only under that path.
      N8TRACKS_BASE_URL: http://localhost:8787
      # Trace, Debug, Information, Warning, Error, or Critical.
      N8TRACKS_LOG_LEVEL: Information
      # Where the app looks inside the container. Change the volumes below, not these.
      N8TRACKS_DATA_PATH: /data
      N8TRACKS_MEDIA_PATH: /media
      N8TRACKS_BACKUP_PATH: /backup
      # Hosts the browser may stream Suno audio from, comma-separated bare host names. Change it
      # only if Suno moves its audio to another host.
      N8TRACKS_SUNO_AUDIO_HOSTS: d2lwuy8qc234o3.cloudfront.net
    # Three separate host folders. Never mount the media folder, or a folder inside it (or one that
    # holds it), at /data or /backup: n8Tracks writes there and gives those folders to PUID:PGID, and
    # the container refuses to start when they overlap.
    volumes:
      # The app's own data, database included. Keep this folder: it is what you back up.
      - ./data:/data
      # Your media files, read-only: n8Tracks never writes here.
      - ./media:/media:ro
      # A folder for backups, on another disk if you can, never inside the media folder. Optional.
      # - ./backup:/backup

  # The MCP gateway is a separate service with its own image, built from this repository too. To run
  # it next to the app, remove the "# " in front of each line below, from "n8tracks-gateway:" down.
  # Its health is then at http://localhost:8788/health. See "The gateway image" in the README.
  # n8tracks-gateway:
  #   build:
  #     context: .
  #     dockerfile: src/n8Tracks.Gateway/Dockerfile
  #   image: n8tracks-gateway:dev
  #   container_name: n8tracks-gateway
  #   restart: unless-stopped
  #   depends_on:
  #     - n8tracks
  #   ports:
  #     - "8788:8788"
  #   environment:
  #     # URL of n8Tracks as the gateway reaches it: the app's service name on the Compose network
  #     # and the port it listens on inside its container. If N8TRACKS_BASE_URL above has a path,
  #     # add it here too (http://n8tracks:8787/n8tracks).
  #     N8TRACKS_API_URL: http://n8tracks:8787
  #     # Port the gateway listens on inside the container. If you change it, change the right-hand
  #     # side of the port mapping above to match.
  #     N8TRACKS_GATEWAY_PORT: "8788"
  #     # Trace, Debug, Information, Warning, Error, or Critical.
  #     N8TRACKS_LOG_LEVEL: Information
  #     # To keep the gateway's log in files as well as on standard output, remove the "# " in front
  #     # of the next four lines and of the two volume lines below. Files are kept for the days
  #     # given (1 to 90) and together take at most the megabytes given (10 to 5120), the oldest
  #     # deleted first. The host folder must be writable by the gateway's user.
  #     # N8TRACKS_GATEWAY_LOG_PATH: /logs
  #     # N8TRACKS_GATEWAY_LOG_RETENTION_DAYS: "14"
  #     # N8TRACKS_GATEWAY_LOG_MAX_MB: "200"
  #   # volumes:
  #   #   - ./gateway-logs:/logs
