name: Bug
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security problems must not be filed here. Use the private vulnerability report link instead.
  - type: textarea
    id: whats-broken
    attributes:
      label: What's broken
      description: In your own words.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Production, preview/stage, or local dev, and the path or command that hits it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Console output, failing request, stack trace, screenshot. Redact tokens and credentials.
    validations:
      required: false
